<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg)" rx="12" />

  <!-- Grid Lines Pattern (Subtle) -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="320" x2="900" y2="320" />
    <line x1="0" y1="400" x2="900" y2="400" />
  </g>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">TOPOLOGIA DE REDE CORPORATIVA — FILIAL BRASÍLIA/DF</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Ambiente de Simulação N1 Service Desk &amp; Infraestrutura Híbrida</text>

  <!-- WAN Block -->
  <rect x="40" y="100" width="160" height="90" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">WAN / INTERNET</text>
  <text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">Link Primário Fibra</text>
  <text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Link Secundário 4G</text>

  <!-- Connection to Firewall -->
  <line x1="200" y1="145" x2="260" y2="145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />

  <!-- Firewall Block -->
  <rect x="260" y="100" width="180" height="90" rx="8" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)" />
  <text x="350" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f43f5e">FIREWALL DE BORDA</text>
  <text x="350" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">NAT / VPN Gateway</text>
  <text x="350" y="163" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">IP WAN: 200.180.x.x</text>
  <text x="350" y="177" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">IP LAN: 192.168.10.1</text>

  <!-- Connection to Switch L3 -->
  <line x1="440" y1="145" x2="500" y2="145" stroke="#10b981" stroke-width="2" />

  <!-- Switch Core L3 -->
  <rect x="500" y="100" width="190" height="90" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
  <text x="595" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981">SWITCH CORE L3</text>
  <text x="595" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">Roteamento Inter-VLAN</text>
  <text x="595" y="163" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Trunk 802.1Q (1 Gbps)</text>
  <text x="595" y="177" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Port Security Habilitado</text>

  <!-- Bus line down from Switch Core -->
  <line x1="595" y1="190" x2="595" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="120" y1="240" x2="790" y2="240" stroke="#64748b" stroke-width="2" />

  <!-- Drop line 1: VLAN 10 (Servidores) -->
  <line x1="120" y1="240" x2="120" y2="280" stroke="#64748b" stroke-width="2" />
  <rect x="40" y="280" width="160" height="150" rx="8" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="120" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">VLAN 10: SERVIÇOS</text>
  <text x="120" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Active Directory DC</text>
  <text x="120" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">10.10.1.10 (DNS/AD)</text>
  <text x="120" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Servidor Arquivos (SMB)</text>
  <text x="120" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">10.10.5.20 (Porta 445)</text>
  <text x="120" y="405" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Escopo DHCP Central</text>

  <!-- Drop line 2: VLAN 20 (Estações de Trabalho) -->
  <line x1="340" y1="240" x2="340" y2="280" stroke="#64748b" stroke-width="2" />
  <rect x="260" y="280" width="160" height="150" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="340" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">VLAN 20: ESTAÇÕES</text>
  <text x="340" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Desktops Windows 11</text>
  <text x="340" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">192.168.20.50-200</text>
  <text x="340" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Notebooks Corporativos</text>
  <text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Gateway: 192.168.20.1</text>
  <text x="340" y="405" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981">● Foco Operacional N1</text>

  <!-- Drop line 3: VLAN 30 (VoIP Telefonia) -->
  <line x1="565" y1="240" x2="565" y2="280" stroke="#64748b" stroke-width="2" />
  <rect x="485" y="280" width="160" height="150" rx="8" fill="url(#cardBg)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)" />
  <text x="565" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">VLAN 30: VOIP / VOZ</text>
  <text x="565" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Telefones IP SIP (PoE)</text>
  <text x="565" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">192.168.30.10-99</text>
  <text x="565" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">QoS Prioritário (CoS 5)</text>
  <text x="565" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">PABX Virtual em Nuvem</text>
  <text x="565" y="405" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Portas SIP 5060 / RTP</text>

  <!-- Drop line 4: VLAN 40 (Wi-Fi Visitantes) -->
  <line x1="790" y1="240" x2="790" y2="280" stroke="#64748b" stroke-width="2" />
  <rect x="710" y="280" width="160" height="150" rx="8" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
  <text x="790" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#a855f7">VLAN 40: VISITANTES</text>
  <text x="790" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Access Points Wi-Fi</text>
  <text x="790" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">172.16.40.0/24</text>
  <text x="790" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Isolamento Total</text>
  <text x="790" y="380" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Sem Acesso Interno</text>
  <text x="790" y="405" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22c55e">Acesso Internet Direto</text>

  <!-- Legend / Watermark -->
  <text x="860" y="465" text-anchor="end" font-family="monospace" font-size="10" fill="#475569">LAB SIMULADO | N1 SERVICE DESK | 2026</text>
</svg>
